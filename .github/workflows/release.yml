name: Build release packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build-macos:
    name: Build macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
      - name: Verify version tag
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "v$(.venv/bin/python -c 'from app import __version__; print(__version__)')" = "$RELEASE_TAG"
      - name: Build application
        run: bash build/build_macos.sh
      - name: Package release asset
        run: ditto -c -k --sequesterRsrc --keepParent dist/VideoDownloader.app "dist/VideoDownloader-${RELEASE_TAG}-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: dist/VideoDownloader-${{ env.RELEASE_TAG }}-macos-arm64.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
      - name: Verify version tag
        shell: pwsh
        run: |
          $tagCommit = git rev-parse "refs/tags/$env:RELEASE_TAG^{commit}"
          $headCommit = git rev-parse HEAD
          if ($headCommit -ne $tagCommit) { throw "Checked-out commit does not match tag $env:RELEASE_TAG" }
          $version = & .\.venv\Scripts\python.exe -c "from app import __version__; print(__version__)"
          if ("v$version" -ne $env:RELEASE_TAG) { throw "Tag $env:RELEASE_TAG does not match app version $version" }
      - name: Build application
        shell: cmd
        run: call build\build_windows.bat
      - name: Package release asset
        shell: pwsh
        run: Compress-Archive -Path dist\VideoDownloader -DestinationPath "dist\VideoDownloader-$env:RELEASE_TAG-windows-x64.zip"
      # 安装包（Inno Setup）：脚本在 build/windows_installer.iss。
      # 这里不做 continue-on-error——安装包是本版的发布契约之一，编不出来就该整版失败，
      # 而不是安静地少发一个文件（.iss 里的界面文案保持 ASCII，正是为了压低这个风险）。
      - name: Build installer
        shell: pwsh
        run: |
          $version = "$env:RELEASE_TAG".TrimStart("v")
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw "找不到 ISCC.exe，Inno Setup 未安装成功" }
          & $iscc "/DAppVersion=$version" "build\windows_installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC 编译失败（退出码 $LASTEXITCODE）" }
          # 统一资产命名：与另外两个平台的 -<tag>-<platform> 对齐（ISCC 用的是去掉 v 的版本号）
          Move-Item "dist\VideoDownloader-$version-windows-x64-setup.exe" `
                    "dist\VideoDownloader-$env:RELEASE_TAG-windows-x64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: |
            dist/VideoDownloader-${{ env.RELEASE_TAG }}-windows-x64.zip
            dist/VideoDownloader-${{ env.RELEASE_TAG }}-windows-x64-setup.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Tk runtime and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk tk
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -c "import tkinter"
      - name: Verify version tag
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "v$(.venv/bin/python -c 'from app import __version__; print(__version__)')" = "$RELEASE_TAG"
      - name: Build application
        run: bash build/build_linux.sh
      - name: Package release asset
        working-directory: dist
        run: zip -r "VideoDownloader-${RELEASE_TAG}-linux-x64.zip" VideoDownloader
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: dist/VideoDownloader-${{ env.RELEASE_TAG }}-linux-x64.zip
          if-no-files-found: error

  publish-release:
    name: Publish release assets
    needs:
      - build-macos
      - build-windows
      - build-linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # 生成 Release 说明要读「上一个版本到本版」的提交，必须先取完整历史：
      # actions/checkout 默认 fetch-depth: 1，那样 git log <prev>..<tag> 是空的。
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      # 不用 --generate-notes：GitHub 只汇总 PR 与新贡献者，本仓库是直接提交，
      # 生成出来只有一行 changelog 链接。改为从提交信息分组排版。
      - name: Generate release notes
        run: |
          python3 build/release_notes.py "$RELEASE_TAG" --output release-notes.md \
            || python3 build/release_notes.py --install-only --output release-notes.md \
            || echo "提交说明生成失败，本版改动见下方 changelog 链接。" > release-notes.md
          echo "--- release-notes.md 预览 ---"
          head -20 release-notes.md
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --notes-file release-notes.md
          fi
          # 上传目录里的全部资产（zip 与 windows 的 setup.exe），逐个列举的话
          # 某个平台少产出一种文件就会让上传直接失败
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
